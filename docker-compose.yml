# RAG service + pgvector saja. Langfuse TIDAK di sini — pakai compose
# resmi upstream via infra/langfuse/fetch-official-compose.sh (Langfuse
# mengubah env var antar minor release; compose resmi harus jadi sumber).
services:
  app:
    build: ./app
    container_name: rag-service
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      RAG_DATABASE_URL: postgresql://rag:rag@rag-db:5432/rag
    depends_on:
      rag-db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  rag-db:
    image: pgvector/pgvector:pg16
    container_name: rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rag-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rag-data:
