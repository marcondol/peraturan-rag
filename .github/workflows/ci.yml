# CI — RAG LLM Observability
# P0 GitHub Actions (rencana 6 minggu kerja remote, Minggu 1-2).
# Dibuat 24 Nov 2026. Repo ini belum ada test suite (pytest) — jadi
# job "test" di sini berupa: compile semua file + install dependency
# + smoke test service dalam mode demo (tanpa LLM, tanpa Langfuse).
# Itu disengaja: pipeline harus hijau dulu sebelum ditambah tes.
#
# Cara pakai: push repo ini ke GitHub, buka tab Actions, lihat run-nya.
# Image hanya di-push ke GHCR saat push ke branch main (bukan di PR).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint, install & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Compile check (semua file Python harus valid)
        run: python -m compileall app

      - name: Smoke test — jalankan service mode demo, cek /health dan /ask
        run: |
          cd app
          # Mode demo = default (LLM_BACKEND tidak diisi), jadi tidak
          # butuh API key, vLLM, atau Langfuse untuk smoke test ini.
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          UVICORN_PID=$!
          trap "kill $UVICORN_PID" EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS -X POST http://127.0.0.1:8000/ask \
            -H 'Content-Type: application/json' \
            -d '{"question": "Apa beda Sidekiq dan Kafka?"}'

  build:
    name: Build image & Trivy scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f app/Dockerfile -t rag-llm-observability:${{ github.sha }} ./app

      - name: Scan image dengan Trivy (HIGH & CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rag-llm-observability:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          # exit-code 0 dulu: laporkan temuan tanpa menggagalkan run
          # pertama. Setelah baseline bersih, naikkan ke 1 supaya
          # temuan baru benar-benar memblokir merge.
          exit-code: "0"

      - name: Login ke GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image ke GHCR (hanya push ke main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag rag-llm-observability:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag rag-llm-observability:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
